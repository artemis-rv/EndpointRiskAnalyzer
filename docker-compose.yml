services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: riskintel-backend

    # ports:
    #   - "8000:8000"

    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - DB_NAME=org_security_posture_prod
      - ENROLLMENT_TOKEN=${ENROLLMENT_TOKEN}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://localhost,https://localhost:3000,https://127.0.0.1,https://127.0.0.1:3000}

    depends_on:
      - mongodb

  mongodb:
    image: mongo:7

    container_name: riskintel-mongodb

    ports:
      - "127.0.0.1:27018:27017"

    volumes:
      - mongodb_data:/data/db

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile

    container_name: riskintel-nginx

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./frontend/build:/usr/share/nginx/html

    depends_on:
      - backend

  postgres:
    image: postgres:17

    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  mongodb_data:
  postgres_data:
